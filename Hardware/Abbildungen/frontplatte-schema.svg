    <text x="450" y="540" font-size="14">SEC</text>
    <text x="669" y="553" font-size="16" letter-spacing="1">VOLTAGE</text>
    <text x="956" y="366" font-size="18" letter-spacing="1">OUTPUT</text>
    <text x="858" y="600" font-size="15">N</text>
    <text x="934" y="600" font-size="15">PE</text>
    <text x="1010" y="600" font-size="15">L</text>
