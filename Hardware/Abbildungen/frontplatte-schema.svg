    <rect x="880" y="378" width="152" height="143" rx="6" fill="#e8703a"/>
    <circle cx="927" cy="440" r="10" fill="#2b2b2b" stroke="none"/>
    <circle cx="985" cy="440" r="10" fill="#2b2b2b" stroke="none"/>
    <circle cx="956" cy="474" r="10" fill="#2b2b2b" stroke="none"/>
    <!-- Warnzeichen -->
    <path d="M 1077 418 l 26 46 h -52 z" fill="#f0d020" stroke-width="2"/>
    <!-- 11 Polklemmen -->
    <circle cx="858" cy="566" r="20" fill="#1f1f1f"/>
    <circle cx="934" cy="566" r="20" fill="#3a9a52"/>
    <circle cx="1010" cy="566" r="20" fill="#d94b45"/>
  </g>

  <!-- Lupensymbol neben dem Melder -->
  <g stroke="#333" stroke-width="3" fill="none">
    <circle cx="546" cy="364" r="9"/>
    <line x1="552" y1="371" x2="560" y2="379" stroke-linecap="round"/>
