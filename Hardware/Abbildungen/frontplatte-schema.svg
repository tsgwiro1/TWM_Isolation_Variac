    <text x="416" y="130" font-size="19">&#8594;|</text>
    <text x="461" y="130" font-size="17">&#9201;</text>
    <text x="371" y="222" font-size="15">1</text>
    <text x="416" y="222" font-size="15">2</text>
    <text x="461" y="222" font-size="15">3</text>
