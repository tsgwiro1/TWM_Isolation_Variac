    <rect x="396" y="141" width="40" height="45" rx="4" fill="#e8c22e"/>
    <rect x="441" y="141" width="40" height="45" rx="4" fill="#3d6fa8"/>
    <!-- 3 graue Preset-Taster -->
    <rect x="351" y="231" width="40" height="45" rx="4" fill="#9c9689"/>
    <rect x="396" y="231" width="40" height="45" rx="4" fill="#9c9689"/>
    <rect x="441" y="231" width="40" height="45" rx="4" fill="#9c9689"/>
    <!-- 4 Hauptschalter -->
    <circle cx="217" cy="441" r="27" fill="#dcdcdc"/>
