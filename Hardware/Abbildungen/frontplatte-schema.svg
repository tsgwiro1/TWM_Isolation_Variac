  <g font-size="19" font-weight="bold" text-anchor="middle">
    <circle cx="313" cy="140" r="16" fill="#1a1a1a"/><text x="313" y="147" fill="#fff">1</text>
    <circle cx="513" cy="163" r="16" fill="#1a1a1a"/><text x="513" y="170" fill="#fff">2</text>
    <circle cx="513" cy="253" r="16" fill="#1a1a1a"/><text x="513" y="260" fill="#fff">3</text>
    <circle cx="277" cy="441" r="16" fill="#1a1a1a"/><text x="277" y="448" fill="#fff">4</text>
    <circle cx="513" cy="400" r="16" fill="#1a1a1a"/><text x="513" y="407" fill="#fff">5</text>
    <circle cx="527" cy="110" r="16" fill="#1a1a1a"/><text x="527" y="117" fill="#fff">6</text>
