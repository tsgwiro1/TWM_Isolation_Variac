<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" width="1240" height="650" font-family="Helvetica, Arial, sans-serif">
  <rect width="1240" height="650" fill="#ffffff"/>
  <rect x="20" y="20" width="1200" height="609" rx="10" fill="#f2f1ef" stroke="#333" stroke-width="3"/>

  <g stroke="#333" stroke-width="2.5" fill="none">
