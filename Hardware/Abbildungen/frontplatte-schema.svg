  <text x="983" y="74" text-anchor="middle" font-size="25" font-style="italic" font-weight="bold" fill="#3d4a7a" letter-spacing="1">ISOLATION VARIAC</text>
  <text x="199" y="582" text-anchor="middle" font-size="20" font-weight="bold" fill="#3d4a7a">TW MICROSYSTEMS</text>

