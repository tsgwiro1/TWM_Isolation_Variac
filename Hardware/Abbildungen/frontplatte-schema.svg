    <!-- 8 Drehknopf -->
    <circle cx="669" cy="441" r="90" fill="#333a33"/>
    <circle cx="669" cy="441" r="74" fill="#3f463f"/>
    <!-- 9 Amperemeter -->
    <rect x="844" y="87" width="220" height="233" rx="5" fill="#2b2b2b"/>
    <rect x="860" y="103" width="188" height="201" rx="3" fill="#fbfbf6"/>
    <path d="M 887 268 A 96 96 0 0 1 1021 268" stroke-width="2"/>
    <line x1="954" y1="268" x2="899" y2="196" stroke-width="3"/>
