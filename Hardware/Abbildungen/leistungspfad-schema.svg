  <text transform="translate(138,1105) rotate(-90)" text-anchor="middle" font-size="14" fill="#444">Rückleiter A &#8594; S8 &#8594; S9 &#8594; Voltmeter &#8594; Ausgang N &#183; nicht geschaltet</text>

  <line x1="150" y1="728" x2="1020" y2="728" stroke="#b03030" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="1020" y="721" text-anchor="end" font-size="14" fill="#b03030">galvanische Trennung — der Sekundärkreis ist netzgetrennt</text>

  <g text-anchor="middle">
    <g font-size="17" font-weight="bold" fill="#1a1a1a">
      <text x="460" y="72">Netzeinspeisung</text>
      <text x="905" y="72">Erdungspunkt</text>
      <text x="905" y="420">Netzteil LRS-75-24</text>
      <text x="460" y="188">Eingangsklemmen S19 / S20</text>
      <text x="460" y="304">Leitungsschutzschalter PRI</text>
      <text x="460" y="420">Hauptschalter, 2-polig</text>
      <text x="460" y="536">Sanftanlauf R4 33 Ω, von K1 überbrückt</text>
      <text x="460" y="652">Trenntransformator, Primärseite</text>
      <text x="460" y="780">Trenntransformator, Sekundärseite</text>
      <text x="905" y="780">Analoges Voltmeter</text>
      <text x="905" y="896">AC-Voltmeter-Print</text>
      <text x="460" y="896">Ausgangsrelais K3</text>
      <text x="460" y="1012">Strombegrenzung, extern</text>
      <text x="460" y="1128">Leitungsschutzschalter SEC</text>
      <text x="460" y="1244">Amperemeter</text>
      <text x="460" y="1360">Ausgang</text>
    </g>
    <g font-size="14" fill="#444">
      <text x="460" y="96">Kaltgeräte-Einbaustecker IEC C14, Rückplatte</text>
      <text x="905" y="96">Rückplatte, PE-Sammelpunkt</text>
      <text x="905" y="444">an S14 und S17</text>
      <text x="460" y="212">Leistungsplatine · Input L / Input N</text>
      <text x="460" y="328">Frontplatte · einpolig, im Primärkreis</text>
      <text x="460" y="444">Frontplatte · S16 → S14 (L) und S18 → S17 (N)</text>
      <text x="460" y="560">Leistungsplatine · S14 → R4 → S15</text>
      <text x="460" y="676">Klemmen 230 (braun) und 0 (blau)</text>
      <text x="460" y="804">Klemme A (blau) und Schleifer S (violett) · E unbeschaltet</text>
      <text x="905" y="804">zeigt die Schleiferspannung</text>
      <text x="905" y="920">direkt an A und S, 0,25 mm²</text>
      <text x="460" y="920">Leistungsplatine · S3 → Knoten X</text>
      <text x="460" y="1036">gelbe T13-Steckdose S4 / S2 · von K2 überbrückt</text>
      <text x="460" y="1152">Frontplatte · einpolig, im Ausgangspfad</text>
      <text x="460" y="1268">Frontplatte · direkt im Ausgangsstrompfad</text>
      <text x="460" y="1384">T13-Steckdose und Polklemmen N / PE / L, parallel</text>
    </g>
    <g font-size="13" fill="#555">
      <text x="728" y="68">PE</text>
      <text x="728" y="778">violett</text>
    </g>
  </g>

