<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 440" width="1240" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1240" height="440" fill="#ffffff"/>
  <rect x="20" y="20" width="1200" height="400" rx="10" fill="#f4f4f2" stroke="#333" stroke-width="3"/>

  <g fill="none" stroke="#333" stroke-width="2.5">
    <!-- 1 Netzteil -->
    <rect x="60" y="90" width="280" height="250" rx="5" fill="#cfcfcf"/>
    <rect x="86" y="120" width="170" height="150" rx="3" fill="#bdbdbd" stroke-width="1.5"/>
    <!-- 2 Leistungsplatine -->
    <rect x="392" y="100" width="230" height="170" rx="4" fill="#2f5d8e"/>
    <rect x="418" y="126" width="44" height="54" rx="3" fill="#e8703a"/>
    <rect x="470" y="126" width="44" height="54" rx="3" fill="#e8703a"/>
    <rect x="522" y="126" width="44" height="54" rx="3" fill="#e8703a"/>
    <!-- 3 T13-Steckdose fuer externe Strombegrenzung -->
    <rect x="676" y="130" width="130" height="130" rx="6" fill="#e6d23a"/>
    <circle cx="714" cy="190" r="9" fill="#2b2b2b" stroke="none"/>
    <circle cx="770" cy="190" r="9" fill="#2b2b2b" stroke="none"/>
    <circle cx="742" cy="222" r="9" fill="#2b2b2b" stroke="none"/>
    <!-- 4 Luefter mit Schutzgitter -->
    <circle cx="948" cy="196" r="88" fill="#333" stroke="#333"/>
    <circle cx="948" cy="196" r="70" fill="none" stroke="#8a8a8a" stroke-width="2"/>
    <circle cx="948" cy="196" r="52" fill="none" stroke="#8a8a8a" stroke-width="2"/>
    <circle cx="948" cy="196" r="34" fill="none" stroke="#8a8a8a" stroke-width="2"/>
    <circle cx="948" cy="196" r="16" fill="#8a8a8a" stroke="none"/>
    <!-- 5 Erdungspunkt -->
    <circle cx="1098" cy="150" r="20" fill="#cfcfcf"/>
    <path d="M 1088 150 h 20 M 1091 157 h 14 M 1094 164 h 8" stroke-width="2.5"/>
    <!-- 6 Kaltgeraete-Einbaustecker -->
    <rect x="1050" y="246" width="92" height="70" rx="6" fill="#2b2b2b"/>
    <rect x="1064" y="262" width="64" height="38" rx="10" fill="#4a4a4a" stroke-width="1.5"/>
    <g fill="#d8d8d8" stroke="none">
      <rect x="1074" y="274" width="7" height="14" rx="2"/>
      <rect x="1092" y="270" width="7" height="14" rx="2"/>
      <rect x="1110" y="274" width="7" height="14" rx="2"/>
    </g>
    <!-- 7 WLAN-Antenne -->
    <rect x="1090" y="356" width="14" height="46" rx="6" fill="#2b2b2b"/>
    <rect x="1084" y="398" width="26" height="14" rx="3" fill="#c9a227"/>
  </g>

  <g font-size="19" font-weight="bold" text-anchor="middle">
    <circle cx="200" cy="62" r="16" fill="#1a1a1a"/><text x="200" y="69" fill="#fff">1</text>
    <circle cx="507" cy="62" r="16" fill="#1a1a1a"/><text x="507" y="69" fill="#fff">2</text>
    <circle cx="741" cy="98" r="16" fill="#1a1a1a"/><text x="741" y="105" fill="#fff">3</text>
    <circle cx="948" cy="62" r="16" fill="#1a1a1a"/><text x="948" y="69" fill="#fff">4</text>
    <circle cx="1150" cy="150" r="16" fill="#1a1a1a"/><text x="1150" y="157" fill="#fff">5</text>
    <circle cx="1180" cy="281" r="16" fill="#1a1a1a"/><text x="1180" y="288" fill="#fff">6</text>
    <circle cx="1160" cy="379" r="16" fill="#1a1a1a"/><text x="1160" y="386" fill="#fff">7</text>
  </g>

  <text x="620" y="410" text-anchor="middle" font-size="14" fill="#666">Blick auf die Innenseite der Rückplatte</text>
</svg>
