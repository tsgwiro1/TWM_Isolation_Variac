<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>REST API Dokumentation - TWM Isolation Variac</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="rapidoc-min.js"></script>
    <style>
        /* RapiDoc soll die volle Breite unterhalb der Nav nutzen */
        .doc-container-api {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }
        rapi-doc {
            width: 100%;
            height: calc(100vh - 120px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="doc-body">
    <div class="doc-container-api">
    <div class="doc-nav">
        <a href="doc_usage.html">1. Bedienung</a>
        <a href="doc_api.html" style="color:#bb86fc">2. API</a>
        <a href="doc_settings.html">3. Einstellungen</a>
        <a href="/" style="float:right">X Schließen</a>
    </div>

    <!-- Interaktive API-Doku (#22): Quelle ist /openapi.yaml (Single Source of Truth).
         RapiDoc liegt lokal im LittleFS (rapidoc-min.js) - funktioniert ohne Internet. -->
    <rapi-doc
        spec-url="/openapi.yaml"
        theme="dark"
        bg-color="#1e1e1e"
        text-color="#e0e0e0"
        primary-color="#bb86fc"
        nav-bg-color="#161616"
        nav-text-color="#e0e0e0"
        nav-hover-text-color="#03dac6"
        render-style="focused"
        show-header="false"
        allow-spec-url-load="false"
        allow-spec-file-load="false"
        allow-server-selection="false"
        allow-authentication="false"
        default-schema-tab="schema"
        schema-style="table">
    </rapi-doc>
    </div>
</body>
</html>
