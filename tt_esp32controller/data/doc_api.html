<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Variac Doku – API-Referenz</title>
    <script>
        (function(){ try {
            var t = localStorage.getItem('variac-theme');
            document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
            var a = localStorage.getItem('variac-accent');
            document.documentElement.dataset.accent = a || 'teal';
        } catch (e) { document.documentElement.dataset.theme = 'dark'; document.documentElement.dataset.accent = 'teal'; } })();
    </script>
    <link rel="stylesheet" href="app.css">
    <script type="module" src="rapidoc-min.js"></script>
    <style>
        rapi-doc {
            display: block;
            width: 100%;
            height: calc(100vh - 190px);
            height: calc(100dvh - 190px);   /* Mobile: ohne Browserleiste (#16) */
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        /* GitHub-#25: schmale Ansicht - die Doku waechst mit dem Inhalt und die Seite
           scrollt normal, statt den Inhalt in einen eigenen Scrollkasten zu sperren. */
        rapi-doc.narrow {
            height: auto;
        }
    </style>
</head>
<body>
<div class="wrap">

    <!-- HEADER -->
    <header class="hdr">
        <div class="hdr-brand">
            <div class="logo">&#8776;V</div>
            <div>
                <div class="hdr-title">Dokumentation</div>
                <div class="hdr-sub">TWM Isolation Variac &middot; API-Referenz</div>
            </div>
        </div>
        <div class="hdr-actions">
            <button class="icon-btn" id="theme-btn" title="Dark / Light">&#9788;</button>
            <div class="menu-anchor">
                <button class="icon-btn" title="Akzentfarbe">&#9673;</button>
                <div class="menu" id="accent-menu">
                    <div class="menu-label">Akzentfarbe</div>
                </div>
            </div>
            <a class="icon-btn" href="index.html" data-tab="variac-dash" target="variac-dash" title="Zum Dashboard" style="font-size:18px;">&#8962;</a>
        </div>
    </header>

    <nav class="doc-nav">
        <a href="doc_usage.html">1. Bedienung</a>
        <a href="doc_api.html" class="active">2. API</a>
        <a href="doc_settings.html">3. Einstellungen</a>
    </nav>

    <!-- Interaktive API-Doku (#22): Quelle ist /openapi.yaml (Single Source of Truth).
         RapiDoc liegt lokal im LittleFS (rapidoc-min.js) - funktioniert ohne Internet.
         Die Farben werden per JS aus dem aktiven Theme/Akzent gesetzt (#23). -->
    <rapi-doc id="rapidoc"
        spec-url="/openapi.yaml"
        render-style="focused"
        show-header="false"
        allow-spec-url-load="false"
        allow-spec-file-load="false"
        allow-server-selection="false"
        allow-authentication="false"
        default-schema-tab="schema"
        schema-style="table">
    </rapi-doc>
</div>
<script src="app.js"></script>
<script>
    // RapiDoc dem aktiven Theme/Akzent angleichen (Farben aus den app.css-Tokens).
    function applyRapidocTheme() {
        var rd = document.getElementById('rapidoc');
        if (!rd) return;
        var cs = getComputedStyle(document.documentElement);
        var v = function (name) { return cs.getPropertyValue(name).trim(); };
        var dark = document.documentElement.dataset.theme !== 'light';
        rd.setAttribute('theme', dark ? 'dark' : 'light');
        rd.setAttribute('bg-color', v('--panel'));
        rd.setAttribute('text-color', v('--text'));
        rd.setAttribute('primary-color', v('--accent'));
        rd.setAttribute('nav-bg-color', v('--bg'));
        rd.setAttribute('nav-text-color', v('--text'));
        rd.setAttribute('nav-hover-text-color', v('--accent'));
        rd.setAttribute('regular-font', "'Space Grotesk', system-ui, sans-serif");
        rd.setAttribute('mono-font', "'IBM Plex Mono', monospace");
    }
    // GitHub-#25: RapiDoc blendet seine Navigationsleiste per Container-Query erst ab
    // 768 px Elementbreite ein (darunter gilt .nav-bar{display:none}). Im render-style
    // "focused" rendert RapiDoc aber immer nur die angewaehlte Sektion, und die Nav ist
    // der einzige Weg zu den Endpunkten - auf dem Handy blieb deshalb nur die Uebersicht
    // uebrig. Unterhalb der Grenze wird auf "view" umgeschaltet: dort stehen alle Tags
    // und Endpunkte aufklappbar untereinander, ganz ohne Navigationsleiste.
    var NAV_MIN_WIDTH = 768;
    function applyRenderStyle(width) {
        var rd = document.getElementById('rapidoc');
        if (!rd) return;
        var narrow = width < NAV_MIN_WIDTH;
        if (narrow === rd.classList.contains('narrow')) return;   // kein Wechsel noetig
        rd.classList.toggle('narrow', narrow);
        rd.setAttribute('render-style', narrow ? 'view' : 'focused');
    }
    function rapidocWidth(rd) {
        // Vor dem ersten Layout hat das Element noch keine Breite - dann naehern wir
        // uns ueber den Viewport an; der ResizeObserver korrigiert exakt nach.
        var w = rd.getBoundingClientRect().width;
        return w > 0 ? w : document.documentElement.clientWidth;
    }
    function initRenderStyle() {
        var rd = document.getElementById('rapidoc');
        if (!rd) return;
        applyRenderStyle(rapidocWidth(rd));   // sofort, ohne auf ein Rendering zu warten
        if (window.ResizeObserver) {
            // Misst das Element selbst - genau die Groesse, auf die sich RapiDocs
            // Container-Query bezieht. Die Umschaltung aendert nur die Hoehe, loest
            // also keine Rueckkopplung ueber die Breite aus.
            new ResizeObserver(function (entries) {
                var w = entries[0].contentRect.width;
                if (w > 0) applyRenderStyle(w);
            }).observe(rd);
        }
        // Zusaetzlich am Fenster: deckt Geraet drehen und Fenstergroesse aendern auch
        // dann ab, wenn der ResizeObserver nicht zustellt. applyRenderStyle ist
        // idempotent, doppelte Ausloeser schaden also nicht.
        window.addEventListener('resize', function () { applyRenderStyle(rapidocWidth(rd)); });
    }
    document.addEventListener('DOMContentLoaded', function () {
        initHeader();
        applyRapidocTheme();
        initRenderStyle();
        // Auf Theme-/Akzentwechsel reagieren (data-Attribute am <html> beobachten)
        new MutationObserver(applyRapidocTheme).observe(document.documentElement, {
            attributes: true, attributeFilter: ['data-theme', 'data-accent']
        });
    });
</script>
</body>
</html>
