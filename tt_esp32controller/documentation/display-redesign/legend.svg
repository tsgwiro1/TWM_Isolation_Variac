<svg xmlns="http://www.w3.org/2000/svg" width="470" height="210" viewBox="0 0 470 210" role="img"><title>Anzeige-Logik</title><rect width="470" height="210" rx="8" fill="#101216"/><text x="20" y="28" font-size="14" fill="#9aa0a7" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" text-anchor="start">ANZEIGE-LOGIK</text><rect x="20" y="48" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,48)"><polygon points="13.6,6.0 7.5,16.3 12.2,16.3 10.4,24.0 16.5,13.4 11.8,13.4" fill="#FF3222"/><rect x="20" y="11.719999999999999" width="10.66" height="7.0200000000000005" rx="1.8" fill="#FFD400"/><path d="M 22.132 11.719999999999999 v-1.8200000000000003 a 3.198 3.198 0 0 1 6.396 0 v 1.8200000000000003" fill="none" stroke="#FFD400" stroke-width="1.7"/><line x1="36" y1="15" x2="45" y2="15" stroke="#1E63D6" stroke-width="1.8"/><path d="M 42 11.8 L 46.5 15 L 42 18.2 Z" fill="#1E63D6"/><line x1="48.5" y1="9" x2="48.5" y2="21" stroke="#1E63D6" stroke-width="2"/></g><text x="88" y="66" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">3 Chips (Ausgang, Limit, Regelung): Symbol leuchtet = EIN, grau = AUS</text><rect x="20" y="79" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,79)"><polygon points="16,6.0 24.3,22.6 7.7,22.6" fill="#FF3222" stroke="#000" stroke-width="0.5"/><rect x="14.4" y="11.2" width="3.2" height="5.0" rx="1" fill="#000"/><rect x="14.4" y="18.1" width="3.2" height="3.2" rx="1" fill="#000"/><polygon points="40,6.0 48.3,22.6 31.7,22.6" fill="#FFD400" stroke="#000" stroke-width="0.5"/><polygon points="41.0,11.0 37.3,17.2 40.1,17.2 39.0,21.8 42.7,15.5 39.9,15.5" fill="#000"/></g><text x="88" y="97" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Warndreiecke links: Achtung (Limit aus, unabh. vom Ausgang) / > 50 V, aktiv pulsierend</text><rect x="20" y="110" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,110)"><text x="35" y="17" font-size="17" fill="#FFD400" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" text-anchor="end">V</text></g><text x="88" y="128" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Ist-Spannung fett, farbig: gelb / rot / hellgrau = mit Limit / ohne Limit / Ausgang aus</text><rect x="20" y="141" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,141)"><text x="35" y="17" font-size="17" fill="#9A9A9A" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="end">V</text></g><text x="88" y="159" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Zielspannung gleich gross, aber grau und nicht fett</text><rect x="20" y="172" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,172)"><rect x="7" y="4" width="20" height="15" rx="3" fill="#0d1f3c" stroke="#1E63D6" stroke-width="2"/></g><text x="88" y="190" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Preset blau, wenn der Zielwert passt (auch bei Ausgang aus); Schloss, wenn Regelung haelt</text></svg>