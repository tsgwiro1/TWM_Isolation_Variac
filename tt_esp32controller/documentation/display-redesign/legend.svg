<svg xmlns="http://www.w3.org/2000/svg" width="470" height="250" viewBox="0 0 470 250" role="img"><title>Farb- und Icon-Logik</title><rect width="470" height="250" rx="8" fill="#101216"/><text x="20" y="30" font-size="14" fill="#9aa0a7" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" text-anchor="start" letter-spacing="1">FARB- &amp; ICON-LOGIK</text><rect x="20" y="52" width="40" height="26" rx="4" fill="#000"/><g transform="translate(23,54)"><text x="30" y="17" font-size="17" fill="#FFD400" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" text-anchor="end" letter-spacing="0">V</text></g><text x="72" y="70" font-size="14" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start" letter-spacing="0">Gelbe Spannung = Strombegrenzung EIN</text><rect x="20" y="85" width="40" height="26" rx="4" fill="#000"/><g transform="translate(23,87)"><text x="30" y="17" font-size="17" fill="#FF3222" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" text-anchor="end" letter-spacing="0">V</text></g><text x="72" y="103" font-size="14" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start" letter-spacing="0">Rote Spannung = Strombegrenzung AUS (Gefahr)</text><rect x="20" y="118" width="40" height="26" rx="4" fill="#000"/><g transform="translate(23,120)"><polygon points="17,6.0 25.3,21.5 8.7,21.5" fill="#FF3222" stroke="#000" stroke-width="0.5"/><rect x="15.9" y="12.1" width="2.2" height="5.6" rx="1" fill="#000"/><circle cx="17" cy="19.9" r="1.5" fill="#000"/></g><text x="72" y="136" font-size="14" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start" letter-spacing="0">Rotes Warndreieck zusaetzlich, wenn Strombegrenzung aus</text><rect x="20" y="151" width="40" height="26" rx="4" fill="#000"/><g transform="translate(23,153)"><polygon points="17,6.0 25.3,21.5 8.7,21.5" fill="#FFD400" stroke="#000" stroke-width="0.5"/><polygon points="18.1,10.7 14.0,17.5 17.1,17.5 15.9,22.6 20.0,15.6 16.9,15.6" fill="#000"/></g><text x="72" y="169" font-size="14" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start" letter-spacing="0">Blitz-im-Dreieck bei Ausgangsspannung > 50 V</text><rect x="20" y="184" width="40" height="26" rx="4" fill="#000"/><g transform="translate(23,186)"><rect x="11" y="10.6" width="12.299999999999999" height="8.100000000000001" rx="1.8" fill="#2E90FF"/><path d="M 13.46 10.6 v-2.1 a 3.6899999999999995 3.6899999999999995 0 0 1 7.379999999999999 0 v 2.1" fill="none" stroke="#2E90FF" stroke-width="1.6"/></g><text x="72" y="202" font-size="14" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start" letter-spacing="0">Schloss = Preset-Spannung wird aktuell gehalten</text><rect x="20" y="217" width="40" height="26" rx="4" fill="#000"/><g transform="translate(23,219)"><rect x="7" y="4" width="20" height="15" rx="3" fill="#0d2440" stroke="#2E90FF" stroke-width="2"/></g><text x="72" y="235" font-size="14" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start" letter-spacing="0">Aktives Preset (LED) wird blau hervorgehoben</text></svg>