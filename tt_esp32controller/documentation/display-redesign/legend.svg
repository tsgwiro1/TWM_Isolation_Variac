<svg xmlns="http://www.w3.org/2000/svg" width="470" height="214" viewBox="0 0 470 214" role="img"><title>Anzeige-Logik</title><rect width="470" height="214" rx="8" fill="#101216"/><text x="20" y="28" font-size="14" fill="#9aa0a7" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" text-anchor="start">ANZEIGE-LOGIK</text><rect x="20" y="46" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,46)"><polygon points="13.6,6.0 7.5,16.3 12.2,16.3 10.4,24.0 16.5,13.4 11.8,13.4" fill="#FF3222"/><rect x="20" y="11.719999999999999" width="10.66" height="7.0200000000000005" rx="1.8" fill="#FFD400"/><path d="M 22.132 11.719999999999999 v-1.8200000000000003 a 3.198 3.198 0 0 1 6.396 0 v 1.8200000000000003" fill="none" stroke="#FFD400" stroke-width="1.7"/><line x1="36" y1="15" x2="45" y2="15" stroke="#1E63D6" stroke-width="1.8"/><path d="M 42 11.8 L 46.5 15 L 42 18.2 Z" fill="#1E63D6"/><line x1="48.5" y1="9" x2="48.5" y2="21" stroke="#1E63D6" stroke-width="2"/></g><text x="88" y="64" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">3 Chips (Ausgang, Limit, Regelung): Symbol leuchtet = EIN, grau = AUS</text><rect x="20" y="74" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,74)"><polygon points="28,5.0 37.2,23.5 18.8,23.5" fill="#FFD400" stroke="#FFD400" stroke-width="7" stroke-linejoin="round"/><rect x="25" y="10.8" width="6" height="5.0" fill="#000"/><circle cx="28" cy="20.0" r="3" fill="#000"/></g><text x="88" y="92" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Gelbes Achtung-Dreieck (schwarzes "!") nur wenn Strombegrenzung AUS — blinkt hart</text><rect x="20" y="102" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,102)"><text x="35" y="17" font-size="17" fill="#FFD400" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" text-anchor="end">V</text></g><text x="88" y="120" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Ist-Spannung gross+fett: gelb / rot / hellgrau = mit Limit / ohne Limit / Ausgang aus</text><rect x="20" y="130" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,130)"><text x="35" y="17" font-size="17" fill="#9A9A9A" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="end">V</text></g><text x="88" y="148" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Zielspannung kleiner, grau, nicht fett (rechtsbündig darunter)</text><rect x="20" y="158" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,158)"><rect x="7" y="4" width="20" height="15" rx="4" fill="none" stroke="#55606b" stroke-width="2"/></g><text x="88" y="176" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Rahmen um Werte + Warnfeld, Radius wie Chips, an den äusseren Chips ausgerichtet</text><rect x="20" y="186" width="56" height="26" rx="4" fill="#000"/><g transform="translate(20,186)"><rect x="7" y="4" width="20" height="15" rx="3" fill="#0d1f3c" stroke="#1E63D6" stroke-width="2"/></g><text x="88" y="204" font-size="13" fill="#dfe2e6" font-family="'Segoe UI',Arial,sans-serif" font-weight="400" text-anchor="start">Preset blau, wenn der Zielwert passt (auch bei Ausgang aus); Schloss = Regelung haelt</text></svg>