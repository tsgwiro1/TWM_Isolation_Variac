; =============================================================================
;  TWM Isolation Variac – ESP32-S3 Controller
;
;  Zwei Environments, KEIN Kommentar-Umschalten mehr nötig:
;    esp32s3_usb  -> Upload/Monitor über USB  (erster Flash, Recovery)
;    esp32s3_ota  -> Upload über WLAN (OTA)    (täglicher Gebrauch)
;
;  Wichtigste Befehle (im Ordner tt_esp32controller/):
;    pio run -e esp32s3_usb -t upload            Firmware via USB flashen
;    pio run -e esp32s3_usb -t uploadfs          Webseiten (data/) via USB
;    pio run -e esp32s3_ota -t upload            Firmware via OTA
;    pio run -e esp32s3_ota -t uploadfs          Webseiten (data/) via OTA
;  Siehe README.md / BACKLOG.md für Details.
; =============================================================================

[platformio]
; Standard-Environment, wenn -e weggelassen wird (täglicher Gebrauch = OTA).
; Für den allerersten Flash eines neuen Boards: -e esp32s3_usb verwenden.
default_envs = esp32s3_ota

; --- Gemeinsame Konfiguration für ALLE Environments ---
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Monitor ---
monitor_speed = 115200
;monitor_filters = esp32_exception_decoder   ; <--- Übersetzt den Crash in Klartext
;build_type = debug                          ; <--- Baut zusätzliche Debug-Infos in den Code

; --- Flash & Board Konfiguration ---
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi ; Erforderlich für N16R2 (16MB Flash / 2MB PSRAM)
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; --- Dateisystem & Partitionierung ---
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; --- Compiler Build Flags ---
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_ARCH_ESP32=1
    -D BOARD_HAS_PSRAM=1

    ; --- TFT_eSPI Konfiguration ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=14
    -D TFT_RST=47
    -D TFT_BL=35
    -D TFT_BACKLIGHT_ON=1 ; (1 entspricht HIGH)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D USE_LITTLEFS=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D USE_HSPI_PORT=1

; --- Bibliotheken (Dependencies) ---
lib_deps =
    waspinator/AccelStepper @ ^1.64.0
    blemasle/MCP23017 @ ^2.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    bodmer/TFT_eSPI @ ^2.5.43
    tzapu/WiFiManager @ ^2.0.17
    madhephaestus/ESP32Encoder @ ^0.11.7
    bblanchon/ArduinoJson @ ^6.21.5
    esp32async/ESPAsyncWebServer @ ^3.10.3

; =============================================================================
;  UPLOAD-VARIANTEN  (erben alles aus [env], setzen nur die Upload-Methode)
; =============================================================================

; --- USB: erster Flash eines neuen Boards / Recovery ---
[env:esp32s3_usb]
; upload_protocol = esptool ist der Default (über USB), nichts weiter nötig.
;upload_speed = 921600
; Port wird i.d.R. automatisch erkannt (Mac: /dev/cu.* | Win: COMx).
; Nur bei Problemen hart eintragen:
;upload_port = /dev/cu.usbserial-0001   ; (Mac)
;upload_port = COM4                     ; (Windows)

; --- OTA: Updates über WLAN (täglicher Gebrauch) ---
[env:esp32s3_ota]
upload_protocol = espota
upload_port = twm_variac.local
; Falls twm_variac.local nicht gefunden wird (v.a. Windows),
; stattdessen die direkte IP eintragen, z.B.:
;upload_port = 192.168.1.50
; Optional, falls am Gerät ein OTA-Passwort gesetzt ist:
;upload_flags = --auth=DEIN_OTA_PASSWORT

; --- SIM: Simulationsmodus zum Abstimmen der Regelung ohne Variac/Voltmeter ---
; Läuft auf dem echten Controller-Board; die "gemessene" Spannung wird aus der
; Stepper-Position berechnet (Streckenmodell). Upload wie üblich via OTA
; (die SIM-Firmware enthält den vollen WiFi-/OTA-Stack). Für den allerersten
; Flash eines Boards ggf. einmalig 'extends = env:esp32s3_usb' verwenden.
[env:esp32s3_sim]
extends = env:esp32s3_ota
build_flags =
    ${env.build_flags}
    -D SIM
