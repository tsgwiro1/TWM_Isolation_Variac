<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWM Isolation Variac – Spannungs-Sequenz</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1b1c1d; --muted: #5b6166;
    --line: #d6dadf; --accent: #2563eb; --ok: #16a34a; --warn: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, "Segoe UI", Arial, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .row label { margin: 0; }
  input[type=text], input[type=number] {
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; font: inherit; width: 130px;
  }
  input[disabled] { background: #eef0f2; color: var(--muted); }
  .volts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .volt-field label { font-weight: 500; font-size: 13px; color: var(--muted); }
  .volt-field input { width: 100%; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { background: var(--warn); color: #fff; border-color: var(--warn); }
  button.go { background: var(--ok); color: #fff; border-color: var(--ok); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 13px; }
  pre#log {
    background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 10px; height: 320px;
    overflow: auto; margin: 0; white-space: pre-wrap; font: 13px/1.45 "Consolas", monospace;
  }
  .wait-line { color: #fcd34d; }
  #statusBox { font-size: 13px; color: var(--muted); white-space: pre-wrap; margin-top: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.on { background: #dcfce7; color: var(--ok); }
  .badge.off { background: #fee2e2; color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>TWM Isolation Variac – Spannungs-Sequenz</h1>
    <div class="hint">Lokale Steuerseite. Alle Werte hier eintragen und den Lauf starten.</div>
  </div>

  <div class="grid2">
    <!-- Verbindung -->
    <div class="card">
      <h2>Verbindung</h2>
      <div class="row">
        <div><label for="host">Controller-IP</label><input type="text" id="host" value="192.168.0.116"></div>
        <div><label for="timeout">Timeout (s)</label><input type="number" id="timeout" value="5" min="1" step="1"></div>
      </div>
      <button id="btnStatus" type="button">Status abfragen</button>
      <div id="statusBox">–</div>
    </div>

    <!-- Modus -->
    <div class="card">
      <h2>Ablauf</h2>
      <div class="row">
        <label><input type="radio" name="mode" value="auto" checked> automatisch</label>
        <label><input type="radio" name="mode" value="manual"> manuell (Weiter-Taste)</label>
      </div>
      <div class="row">
        <div><label for="interval">Intervall (s)</label><input type="number" id="interval" value="10" min="0" step="0.5"></div>
        <span class="hint">Wartezeit bis zur nächsten Spannung (nur bei „automatisch").</span>
      </div>
      <div class="row"><label><input type="checkbox" id="limitOff"> Strombegrenzung nach letzter Spannung ausschalten</label></div>
      <div class="row"><label><input type="checkbox" id="shutdown" checked> Am Ende Ausgang ausschalten und auf 0 V</label></div>
    </div>
  </div>

  <!-- Spannungen -->
  <div class="card">
    <h2>Soll-Spannungen</h2>
    <div class="row">
      <label for="count">Anzahl Spannungen (max. 10)</label>
      <input type="number" id="count" value="7" min="1" max="10" step="1">
      <button id="btnApply" type="button">Felder anwenden</button>
    </div>
    <div class="volts" id="volts"></div>
  </div>

  <!-- Steuerung -->
  <div class="card">
    <h2>Steuerung</h2>
    <div class="actions">
      <button id="btnStart" class="primary" type="button">Sequenz starten</button>
      <button id="btnNext" class="go" type="button" disabled>Weiter ▶</button>
      <button id="btnEstop" class="danger" type="button">Not-Aus (0 V, Ausgang AUS)</button>
    </div>
    <div class="hint" id="runState" style="margin-top:10px;">Bereit.</div>
  </div>

  <!-- Log -->
  <div class="card">
    <h2>Live-Ausgabe</h2>
    <pre id="log"></pre>
  </div>
</div>

<script>
const DEFAULTS = [20, 50, 75, 100, 150, 200, 230];
const MAX = 10;
let sessionId = null, sinceIndex = 0, pollTimer = null;

const $ = (id) => document.getElementById(id);

function buildFields() {
  let n = parseInt($("count").value, 10);
  if (isNaN(n) || n < 1) n = 1;
  if (n > MAX) { n = MAX; $("count").value = MAX; }
  const container = $("volts");
  const old = [...container.querySelectorAll("input")].map(i => i.value);
  container.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const val = old[i] !== undefined ? old[i] : (DEFAULTS[i] !== undefined ? DEFAULTS[i] : "");
    const div = document.createElement("div");
    div.className = "volt-field";
    div.innerHTML = `<label>Schritt ${i + 1} (V)</label>
      <input type="number" step="0.1" value="${val}">`;
    container.appendChild(div);
  }
}

function getVoltages() {
  const vals = [...$("volts").querySelectorAll("input")].map(i => i.value.trim());
  if (vals.some(v => v === "" || isNaN(parseFloat(v)))) return null;
  return vals.map(v => parseFloat(v));
}

function appendLog(lines) {
  const log = $("log");
  for (const line of lines) {
    const span = document.createElement("span");
    if (line.startsWith("[WAIT]")) span.className = "wait-line";
    span.textContent = line + "\n";
    log.appendChild(span);
  }
  log.scrollTop = log.scrollHeight;
}

function setRunning(running) {
  $("btnStart").disabled = running;
  $("btnApply").disabled = running;
  $("count").disabled = running;
}

async function refreshStatus() {
  const host = encodeURIComponent($("host").value);
  const timeout = encodeURIComponent($("timeout").value);
  $("statusBox").textContent = "Frage Status ab …";
  try {
    const r = await fetch(`/api/status?host=${host}&timeout=${timeout}`);
    const d = await r.json();
    if (!d.ok) { $("statusBox").textContent = "Fehler: " + d.error; return; }
    const s = d.status, st = s.states || {};
    const b = (v) => `<span class="badge ${v ? "on" : "off"}">${v ? "EIN" : "AUS"}</span>`;
    $("statusBox").innerHTML =
      `Ist ${s.voltage_actual} V / Soll ${s.voltage_setpoint} V &nbsp;·&nbsp; ` +
      `Ausgang ${b(st.output_on)} Begrenzung ${b(st.limit_on)} Regelung ${b(st.regulation_on)}`;
  } catch (e) {
    $("statusBox").textContent = "Verbindungsfehler: " + e;
  }
}

async function startRun() {
  const voltages = getVoltages();
  if (!voltages) { alert("Bitte alle Spannungsfelder mit gültigen Zahlen füllen."); return; }
  if (voltages.length > MAX) { alert("Maximal " + MAX + " Spannungen."); return; }
  const cfg = {
    host: $("host").value,
    timeout: parseFloat($("timeout").value) || 5,
    mode: document.querySelector('input[name=mode]:checked').value,
    interval: parseFloat($("interval").value) || 0,
    voltages: voltages,
    limitOffAfterLast: $("limitOff").checked,
    shutdown: $("shutdown").checked,
  };
  $("log").innerHTML = ""; sinceIndex = 0;
  try {
    const r = await fetch("/api/start", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(cfg),
    });
    const d = await r.json();
    if (!d.ok) { alert("Start fehlgeschlagen: " + d.error); return; }
    sessionId = d.id;
    setRunning(true);
    $("runState").textContent = "Läuft …";
    poll();
  } catch (e) {
    alert("Start fehlgeschlagen: " + e);
  }
}

async function poll() {
  if (!sessionId) return;
  try {
    const r = await fetch(`/api/poll?id=${sessionId}&since=${sinceIndex}`);
    const d = await r.json();
    if (d.ok) {
      if (d.lines.length) { appendLog(d.lines); sinceIndex = d.next; }
      const lastLines = [...$("log").querySelectorAll("span")];
      const lastText = lastLines.length ? lastLines[lastLines.length - 1].textContent.trim() : "";
      const waiting = d.running && lastText.startsWith("[WAIT]");
      $("btnNext").disabled = !waiting;
      if (waiting) $("runState").textContent = "Wartet auf Weiter …";
      if (!d.running) {
        setRunning(false);
        $("btnNext").disabled = true;
        $("runState").textContent = "Beendet (Code " + d.code + ").";
        sessionId = null;
        return;
      } else {
        $("runState").textContent = waiting ? "Wartet auf Weiter …" : "Läuft …";
      }
    }
  } catch (e) { /* weiter pollen */ }
  pollTimer = setTimeout(poll, 600);
}

async function sendNext() {
  if (!sessionId) return;
  $("btnNext").disabled = true;
  await fetch("/api/next", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: sessionId}),
  });
}

async function estop() {
  if (!confirm("Not-Aus auslösen? Ausgang wird ausgeschaltet und Spannung auf 0 V gesetzt.")) return;
  try {
    const r = await fetch("/api/estop", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: sessionId, host: $("host").value, timeout: parseFloat($("timeout").value) || 5}),
    });
    const d = await r.json();
    appendLog(["", d.ok ? ">>> " + d.message : ">>> Not-Aus FEHLER: " + d.error]);
  } catch (e) {
    appendLog(["", ">>> Not-Aus FEHLER: " + e]);
  }
}

$("btnApply").addEventListener("click", buildFields);
$("count").addEventListener("change", buildFields);
$("btnStatus").addEventListener("click", refreshStatus);
$("btnStart").addEventListener("click", startRun);
$("btnNext").addEventListener("click", sendNext);
$("btnEstop").addEventListener("click", estop);

buildFields();
</script>
</body>
</html>
