; =============================================================================
;  TWM Isolation Variac – AC-RMS-Voltmeter (STM32F103 "Blue Pill")
;
;  Separates PlatformIO-Projekt (eigene Plattform ststm32 / STM32duino).
;  Upload über ST-Link (SWD).
;
;  Wichtigste Befehle (im Ordner tt_voltmeter/):
;    pio run                         bauen
;    pio run -t upload               via ST-Link flashen
;    pio device monitor              Konsole/Menü (Serial = USB-CDC am USB-Port)
;
;  Schnittstellen:
;    USART1 (PA9/PA10)          -> Datenleitung zum ESP32-Controller (RMS-Pakete);
;                                  liegt auf dem ROM-Bootloader-Port (spätere FW-Updates via Controller)
;    USB-CDC (USB-Port, PA11/PA12) -> "Serial" Konsole/Kalibrierung
; =============================================================================

[env:bluepill_voltmeter]
platform = ststm32
board = genericSTM32F103CB        ; 128 KB Flash
framework = arduino

; --- Upload & Monitor ---
upload_protocol = stlink
monitor_speed = 115200

; --- Build Flags ---
build_flags =
    ; Konsole/Menü ("Serial") über native USB-CDC der Blue Pill (USB-Port, PA11/PA12).
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    ; Link zum Controller über HardwareSerial "Serial1" = USART1 (PA9/PA10)
    -D ENABLE_HWSERIAL1
    ; Float-Unterstützung in printf/snprintf aktivieren (nano.specs lässt %f sonst weg)
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
    ; Optimierung für Größe (HAL + Core auf 128 KB)
    -Os

; Hinweis: Der Code nutzt zusätzlich die STM32-HAL direkt (ADC+DMA, Timer,
; USART2). Die benötigten HAL-Module sind in STM32duino standardmäßig aktiv.
; Falls beim Bauen ein HAL-Modul fehlt, hier ergänzen, z.B.:
;   -D HAL_DMA_MODULE_ENABLED
